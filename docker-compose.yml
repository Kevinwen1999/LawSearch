services:
  db:
    image: pgvector/pgvector:pg16
    container_name: lawsearch-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lawsearch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lawsearch}
      POSTGRES_DB: ${POSTGRES_DB:-lawsearch}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lawsearch} -d ${POSTGRES_DB:-lawsearch}"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    # Docker Hub minio/minio is no longer published; quay.io still serves the community image.
    image: quay.io/minio/minio:latest
    container_name: lawsearch-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  miniodata:
