  - id: lc-fc-02
    phase: 1
    jurisdiction: federal
    area: immigration and refugee law / judicial review of RAD decision / internal flight alternative
    source: drafted-from-decision
    drafted_from: 2020 FC 799
    scenario: My client is a woman from a large West African city who came to Canada with her two young
      daughters after her husband's extended family insisted the girls undergo female genital mutilation
      and, following a death in the family, accused her of witchcraft on the word of a traditional oracle.
      The family reported her to the police, who questioned her husband for about two hours about where
      she was; there has been no further contact from the police in the roughly ten months since. She says
      one of her husband's uncles helps politicians during campaigns and could use those connections to
      find her anywhere, and that the national police computer network would let officers locate her in
      any city. The refugee appeal tribunal found she could safely live in another major city far from her
      home region, saying her evidence about the uncle's reach was thin and inconsistent, that her husband's
      very short supporting affidavit said nothing about the uncle or the interrogation, and that discrimination
      against people who are not indigenous to that city, plus the high cost of living, did not make relocation
      unreasonable given her education and the family's successful business. It gave little weight to a
      psychologist's report diagnosing depression and PTSD because it rested on a single one-hour assessment
      by a non-treating clinician. She wants to know whether a court will set aside that relocation finding
      on the basis that she was held to too high a standard of proof, that her sworn word should have been
      presumed true without corroboration, and that her mental health and the country condition evidence
      were brushed aside.
    legal_question: On reasonableness review, what must a refugee claimant establish to defeat a proposed
      internal flight alternative — particularly the threshold on the second prong, the role of the presumption
      of truthfulness and the absence of corroboration, and the treatment of a psychological report and
      country condition evidence of discrimination against non-indigenes?
    expected_authorities:
