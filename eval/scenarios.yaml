  - id: lc-tcc-03
    phase: 1
    jurisdiction: federal
    area: Aboriginal law / income tax — Indian Act s. 87 tax exemption, Charter and s. 35 constitutional
      challenges, motion to strike pleadings
    source: drafted-from-decision
    drafted_from: 2013 TCC 303
    scenario: Two clients are registered status Indians, each a member of a different First Nation, who
      lived and worked in a large city during the years in issue. They were employed through a placement
      agency that hired out Indigenous workers to urban social service organizations; one worked part-time
      as an Indigenous support worker and the other at an Indigenous legal clinic. They did not report that
      employment income, and the tax authority reassessed them on the basis that the income was not situated
      on a reserve and so fell outside the Indian Act exemption. Acting for themselves, they filed appeals
      arguing that Indigenous people have never agreed to be taxed and were never consulted, that no constitutional
      conference was ever convened on Indigenous taxation, that the Crown breached its fiduciary duty and
      duty to consult, that taxing off-reserve earnings discriminates against Indigenous people who work
      off-reserve and interferes with their right to earn a living anywhere in the country, and that the
      tax court has no jurisdiction over inherent Indigenous rights. The Crown has moved to strike the appeals
      and the constitutional notice outright, saying they raise nothing that could ever succeed. Can these
      constitutional and inherent-rights arguments survive a motion to strike so that they get a hearing
      on the merits?
    legal_question: Is it plain and obvious that claims by status Indians to a general inherent or treaty-based
      immunity from income tax — and related arguments that limiting the Indian Act exemption to property
      situated on a reserve breaches ss. 6, 15 and 25 of the Charter, ss. 35 and 35.1 of the Constitution
      Act, 1982, the Crown's fiduciary duty and duty to consult, and UNDRIP — disclose no reasonable cause
      of action and should be struck?
