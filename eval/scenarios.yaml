  - id: lc-cirb-01
    phase: 1
    jurisdiction: federal
    area: federal labour relations / unfair labour practice — dismissal for union activity and reverse onus
    source: drafted-from-decision
    drafted_from: 2008 CIRB 406
    scenario: My client is an owner-operator who hauled marine containers for a small federally regulated
      trucking company, and he was well known among the drivers as the person they elected to speak for
      them during an industry-wide port dispute; he stayed on as the drivers' representative and was active
      in the union that later applied to certify his employer's drivers. The certification application was
      filed about a year before the events in question, the employer hired counsel to oppose it, and the
      objections were only dropped shortly before my client was cut off. He had been off work with a sprained
      ankle from a non-work accident, gave the office a medical note, and says he called the dispatcher
      several times a week once he could wear his safety boot, always being told work was slow; he was then
      told he would no longer be dispatched because someone had seen him working elsewhere. At the hearing
      the employer's owner was the only witness, said he had no idea there was a union or that my client
      was involved, and relied on unnamed informants, old warning letters and a list of missed Mondays to
      justify the decision, without calling the dispatcher or anyone with first-hand knowledge. Who has
      to prove what here, and what does the employer have to establish to show the decision to stop dispatching
      him had nothing to do with his union role, given that everything it complains about happened while
      the certification application was pending?
    legal_question: In a complaint under s. 94(3)(a)(i) of the Canada Labour Code, what burden does s. 98(4)
      impose on the employer, and how is that burden affected where the dismissal occurs between the filing
      of a certification application and certification — must the complainant show there is "no other reasonable
      explanation" for the termination?
