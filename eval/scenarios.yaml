  - id: lc-citt-01
    phase: 1
    jurisdiction: federal
    area: customs law / tariff classification — prohibited weapons (knives) under tariff item 9898.00.00
    source: drafted-from-decision
    drafted_from: CITT AP-2021-035
    scenario: 'My client ordered a batch of about ten inexpensive folding knives from an overseas seller,
      which arrived by mail and were immediately held by border officers and refused entry as prohibited
      weapons. Each knife has a small tab or "flipper" sticking out near the pivot: with the blade closed,
      pressing the flipper with one finger makes the blade swing out fast and lock fully open, and once
      it starts he can''t slow or stop it. He asked the agency to reconsider and they confirmed the original
      decision, so he wants to appeal to the trade tribunal. His points are that identical or nearly identical
      knives are openly sold in Canadian outdoor and sporting goods chains, that these particular ones were
      bought as a holiday gift and never for resale, and that police have never charged anyone here for
      selling or carrying them — so the border agency seems to be the only body treating them as prohibited.
      Can he get the refusal overturned on that basis?'
    legal_question: Is a folding knife whose blade is released and locks open by finger pressure on an integral
      flipper or protrusion a "prohibited weapon" under paragraph 84(1)(a) of the Criminal Code — i.e.,
      does it open "automatically" by hand pressure applied to a device in or attached to the handle — and
      are the domestic availability of similar knives, the importer's innocent intended use, and the absence
      of police enforcement relevant to classification under tariff item 9898.00.00?
