  - id: lc-sst-01
    phase: 1
    jurisdiction: federal
    area: social security / Canada Pension Plan disability pension — severe and prolonged disability at
      the minimum qualifying period
    source: drafted-from-decision
    drafted_from: 2024 SST 1180
    scenario: My client is a man in his late fifties who came to Canada alone as a refugee in his twenties,
      has a high school education from abroad plus one year of ESL, and worked a string of low-paying entry-level
      jobs (factory work, dishwashing, cashier, stock work) with long gaps on EI and welfare. He had recurring
      major depression from the early 2000s, was laid off from his last job in the mid-2000s, and then,
      while off work and in psychiatric treatment, he was robbed and violently beaten on the street, which
      left him with PTSD; he also has long-standing back pain from an earlier workplace injury. He went
      onto provincial disability benefits shortly afterward and has never worked since. He only applied
      for CPP disability roughly sixteen years later, when the rising cost of living made him realize the
      federal benefit might pay more, and his coverage period based on his contributions ended at the end
      of the year of the assault. The evidentiary problem is that his old family doctor retired and those
      records are gone — the only records are from a new family doctor starting eight years after the coverage
      period ended, which the government says show no significant limitations, plus a psychiatrist's report
      written for a lawyer about a year after the assault and a recent report from the same psychiatrist.
      He also wants to know whether his very low but steady past earnings even counted as real employment
      income for this purpose, and how far back any payments could go given how late he applied. Can he
      establish a severe and prolonged disability as of a coverage period that closed sixteen years before
      he applied, on this record?
    legal_question: Can a claimant prove a severe and prolonged disability as of a minimum qualifying period
      that ended many years before the application, where contemporaneous family-practice records are unavailable
      and the main support is a treating psychiatrist's report prepared shortly after the MQP plus a much
      later report — and how are the "real world" factors and the pre-2014 meaning of "substantially gainful"
      applied to a history of consistent but very low earnings?
