  - id: lc-fc-03
    phase: 1
    jurisdiction: federal
    area: immigration and refugee law / judicial review of RAD credibility and implausibility findings
    source: drafted-from-decision
    drafted_from: 2020 FC 901
    scenario: 'My client is a young man who holds citizenship in two Middle Eastern countries and claimed
      refugee protection here after fleeing the one where he had been living. He says an armed political-militia
      group spent about two years pressuring him by phone to join their fighters in a neighbouring country''s
      war, escalating from appeals to duty and offers of money to threats, and that he repeatedly changed
      his phone number, his job and his address in the capital to avoid them. The final incident he describes
      is masked men with machine guns forcing their way into his mother''s home and trying to drag him out,
      who left empty-handed and injured his mother after she and his sister fought them off. The Board''s
      appeal division rejected the claim as implausible: it relied on country-condition material in the
      national documentation package in which numerous academics, embassy staff and NGO observers said the
      group does not forcibly recruit, and it discounted a single expert''s reference to "anecdotal evidence"
      of forced recruitment occurring mainly in rural areas, noting my client lived in urban districts.
      It also found his account internally improbable — that a group with that intelligence and military
      capacity could not find him for two years, then abandoned an armed abduction because two women intervened
      — and said his supporting medical report, leases and family letters did not corroborate the recruitment
      allegation. Two recent Federal Court decisions on the very same country evidence and a similar recruitment
      allegation found the Board''s reasoning unreasonable; my client wants to know whether a court will
      set this decision aside on the same basis, and what "implausibility findings only in the clearest
      of cases" actually requires of the Board.'
    legal_question: On reasonableness review, when is a refugee tribunal's implausibility-based credibility
      finding sustainable — specifically, does the "clearest of cases" standard displace the claimant's
      balance-of-probabilities burden or impose an impossibility threshold, and does discounting an expert's
      "anecdotal" evidence of forced recruitment, standing alone, make the decision unreasonable where the
      tribunal also weighed the broader country evidence and the claimant's own narrative cumulatively?
    expected_authorities:
