  - id: lc-fca-02
    phase: 1
    jurisdiction: federal
    area: public service staffing / abuse of authority in an internal appointment process; judicial review
      of a labour and employment board
    source: drafted-from-decision
    drafted_from: 2018 FCA 97
    scenario: My client spent about twelve years as a front-line officer in the federal department that
      administers immigration, and he applied in a large internal competition to be appointed as an adjudicator
      at the federal tribunal that hears protection claims. The posting required "recent" experience either
      in decision-making in a judicial or quasi-judicial setting or in conducting research or inquiries
      in a judicial or quasi-judicial setting or in immigration, but it never said how much experience or
      how "recent" was measured; only after he was screened out did he learn the department had internally
      fixed it at twelve months within the past five years, and had given screening committees a reference
      guide and a chart listing which job classifications counted. The chart said that officers doing pre-removal
      risk assessments make quasi-judicial decisions while front-line immigration officers make purely administrative
      ones, so only the four months he had recently spent in the risk-assessment role was credited and his
      dozen years of interviewing, admissibility determinations, criminal-equivalency analysis and database
      inquiries counted for nothing. He believes the two jobs do essentially the same work — both officers
      act as ministerial delegates under the same statute — and he points to court decisions saying risk-assessment
      officers are not a quasi-judicial body, plus union-management minutes suggesting the criteria were
      shaped to protect risk-assessment officers whose positions were about to be eliminated by pending
      legislative reform. He also asked for an informal discussion after being screened out and offered
      further detail about his duties, but the employer would not reconsider, even though some other candidates
      were allowed to continue. He wants to know whether a staffing complaint of abuse of authority can
      succeed where the employer used unpublished screening definitions and a chart pre-classifying job
      titles as qualifying or not, and whether a reviewing court will second-guess the board's acceptance
      of the employer's explanation.
    legal_question: Does an employer abuse its authority under the merit provisions of the public service
      staffing legislation when it defines "recent experience" only in unpublished screening tools and uses
      a chart designating some job classifications as quasi-judicial and others as merely administrative,
      and how much deference does a reviewing court owe the board's findings that the screening committee's
      discretion was not fettered and that the candidate's written application did not establish the required
      experience?
