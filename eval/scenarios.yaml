  - id: lc-fc-04
    phase: 1
    jurisdiction: federal
    area: immigration law / spousal sponsorship — genuineness of marriage under s. 4(1) of the Regulations
    source: drafted-from-decision
    drafted_from: 2018 FC 657
    scenario: 'My client is a woman in her thirties from South Asia who came to Canada on a temporary work
      permit and later married a Canadian citizen roughly twenty years her senior. He was born abroad, came
      to Canada through a spousal sponsorship himself decades ago, and has since married and filed sponsorship
      or spousal applications for four other women from the same country — one of those earlier applications
      was refused on marriage-of-convenience grounds. My client began living with him while he was still
      legally married to his previous wife; he divorced her and married my client a few weeks later, and
      they now have a baby daughter together. At an in-person interview the officer questioned them separately
      and then together and flagged a series of inconsistencies: neither could say what region of the country
      the other came from, they gave different accounts of when they met, when they began cohabiting, where
      they went on their honeymoon and their last vacation, and my client did not know her husband''s work
      schedule. The officer refused the application, relying heavily on the husband''s marital and sponsorship
      history and on the couple''s demeanour and body language, and my clients say the officer had made
      up her mind before they walked in and treated them like criminals from the moment she warned them
      to answer truthfully. Can the refusal be set aside on judicial review — was the officer entitled to
      weigh the sponsor''s past marriages and divorces, and doesn''t the birth of their child establish
      that the marriage is genuine?'
    legal_question: On reasonableness review of a refusal under s. 4(1) of the IRP Regulations, may an officer
      rely on a sponsor's history of prior marriages, divorces and spousal sponsorship applications, together
      with interview discrepancies and demeanour, to find a marriage not genuine — and what evidence is
      needed to rebut the presumption that the officer acted in good faith?
