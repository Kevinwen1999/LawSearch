  - id: lc-tcc-02
    phase: 1
    jurisdiction: federal
    area: tax litigation / pleadings — motion to strike Crown's reply, assumptions of fact, deductibility
      of settlement payments
    source: drafted-from-decision
    drafted_from: 2011 TCC 568
    scenario: Our client is a large Canadian financial institution. Through foreign affiliates it took part
      in structured financing deals with a major energy company that later collapsed amid an accounting
      scandal, and it was named in a securities class action and in claims brought by the collapsed company's
      bankruptcy estate. It settled both suits for several billion dollars, with no court ever ruling on
      whether it had actually done anything wrong, and deducted the settlement payments, interest and legal
      fees as business expenses. The Minister denied the deductions, and when we appealed, the Crown filed
      a reply running more than eighty pages, roughly seventy of which are assumptions of fact — repeatedly
      characterizing the financings as "disguised loans," asserting that the client knowingly aided fraud
      and falsified financial statements, reciting at length the conduct and internal affairs of the energy
      company and other third parties, quoting from the U.S. pleadings, and naming employees who were dismissed.
      The Crown's theory is that conduct so "egregious or repulsive" bars deduction regardless of income-earning
      purpose, and by pleading all of this as assumptions it would put the burden on our client to disprove
      fraud it was never found to have committed. Can we get the whole reply struck, or at least force the
      Crown to remove the fraud characterizations, the third-party material and the pages of evidence, and
      is the "egregious or repulsive" theory itself doomed enough to be struck out now?
    legal_question: On a motion to strike under Rule 53 of the Tax Court of Canada Rules (General Procedure),
      when will a Crown reply be struck in whole or in part for pleading conclusions of law or mixed fact
      and law, evidence rather than material facts, scandalous or prejudicial allegations of fraud, and
      assumptions about third parties outside the taxpayer's knowledge — and can a novel legal theory such
      as the "egregious or repulsive" limit on deductibility be struck as having no reasonable prospect
      of success?
    expected_authorities:
    - citation: 2011 TCC 568
      name: Canadian Imperial Bank of Commerce v. The Queen
      kind: case
      relevance: primary
      court: TCC
