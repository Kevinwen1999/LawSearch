  - id: lc-rad-01
    phase: 1
    jurisdiction: federal
    area: immigration and refugee law / refugee appeal — admissibility of new evidence on appeal (s. 110(4)
      IRPA) and standard of review of first-level credibility findings
    source: drafted-from-decision
    drafted_from: TB4-03249
    scenario: My client is a national of a former Soviet republic who says he had been an active member
      of an opposition political party since his teens, including in a supervisory role organizing outreach
      about the party platform. After his party lost the national election, he says security officials beat
      and threatened him, told him to stop his political activity, and pressured him to give evidence against
      a former party official; he eventually paid a smuggler to get him to Canada and claimed protection.
      The first-level refugee tribunal refused the claim, finding he had not credibly established the political
      profile he alleged — it relied on shifting testimony about when he was last active, an inconsistency
      between his port-of-entry statement and his testimony about whether a health condition predated the
      assault, and his ignorance of well-publicized party controversies. At the hearing he explained he
      could not obtain proof of membership because his former supervisor and fellow members had left the
      country; the tribunal rejected that explanation. Now, after the refusal, he has obtained a freshly
      issued party membership card and a letter from a party official confirming he has been an active member
      for nearly a decade, and he wants to file them on appeal and get an oral hearing. He had counsel throughout,
      and roughly ten months passed between filing the claim and the refusal. Can he put these documents
      before the appeal division as new evidence, and how closely will the appeal body second-guess the
      credibility findings below?
    legal_question: When documents are created after a refugee claim is rejected but attest to facts (party
      membership and activity) that existed all along, do they qualify as "new evidence" under s. 110(4)
      of IRPA — in particular, could the appellant reasonably have been expected to have obtained and presented
      them before the rejection — and what standard does the Refugee Appeal Division apply in reviewing
      the Refugee Protection Division's credibility findings?
