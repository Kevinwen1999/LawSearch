  - id: lc-fca-01
    phase: 1
    jurisdiction: federal
    area: patent law / pharmaceutical regulatory — utility, promise of the patent, sound prediction, scope
      of notice of allegation
    source: drafted-from-decision
    drafted_from: 2012 FCA 103
    scenario: 'Our client is a generic drug manufacturer that filed an abbreviated submission with the federal
      health regulator to market a copy of a brand-name oral medication used to treat symptoms of Alzheimer''s-type
      dementia. It served a notice challenging the validity of the listed compound patent, and the brand
      company and the foreign patent owner responded by applying to court to block approval until the patent
      expires. The patent was filed in the late 1980s based only on animal testing — the active compound
      had never been tried in humans — and it claims both the compound itself and a composition for treating
      senile dementia. After the innovator disclosed its underlying lab records, our client discovered that
      some data reported in the patent did not match the actual experiments: a test described as run on
      one rodent species'' brain tissue was in fact run on another''s, a dosing and timing description in
      a learning-impairment study was wrong, and a toxicity figure stated in the patent was an extrapolation
      rather than a dose actually administered. Our client also says the patent''s text talks up the compound
      as having low toxicity and lasting longer and being safer than two older drugs in the field, so the
      patent should be read as promising those things and should fall because nothing in it could support
      such a prediction. Two problems: the accuracy-of-the-data argument was never spelled out in the original
      notice we served, because we didn''t have the lab records yet, and the judge raised the adequacy of
      our notice on his own at the hearing. Can we get the patent knocked out on these grounds?'
    legal_question: In a summary drug-approval prohibition proceeding, (i) can a generic raise a disclosure/accuracy
      attack not pleaded in its notice of allegation, and are minor data-reporting errors material to whether
      the patent discloses a factual basis for a sound prediction; and (ii) when do statements in a patent's
      disclosure about low toxicity and advantages over prior art compounds form part of the patent's "promise"
      for utility purposes?
