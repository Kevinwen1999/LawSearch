  - id: lc-chrt-01
    phase: 1
    jurisdiction: federal
    area: human rights — pre-hearing documentary disclosure in a federal employment discrimination complaint
      (duty to accommodate, systemic discrimination, employment equity evidence)
    source: drafted-from-decision
    drafted_from: 2015 CHRT 13
    scenario: 'My client is a federal government engineer with a medical condition he says is a disability.
      He applied for a senior engineering position without disclosing his condition, was assessed and placed
      in the pool of qualified candidates, but was then told his interview had been merely "OK" and that
      he would not be selected once the position was actually created. He then self-identified as a person
      with a disability and filed an accommodation request, arguing the only meaningful accommodation was
      to appoint him directly from the qualified pool, because the department''s "right fit" selection standard
      is itself discriminatory against people with his condition; the department instead offered to re-run
      the assessment after a psychology centre assessed what accommodations he needed, and he refused to
      attend. His complaint alleges both an individual failure to accommodate and a discriminatory policy
      or practice. At the pre-hearing stage he is now asking the employer to hand over a great deal more
      material: every email, briefing note and memo touching nine named managers over set periods; records
      of accommodation he received in three unrelated staffing competitions, plus all of the psychology
      centre''s analysis of accommodation options for him; the applications and resumes of two other unsuccessful
      candidates; documents about a harassment issue involving one manager; and the executive performance
      agreements of two senior managers, to show they were rewarded for meeting employment equity targets
      favouring a different designated group. The employer says all of this is irrelevant, a fishing expedition,
      and that employment equity legislation operates independently of human rights law, while my client
      argues the seriousness of the case entitles him to a higher standard of disclosure than the tribunal''s
      own rules provide. How much of this is he actually entitled to receive before the hearing?'
    legal_question: What standard governs pre-hearing documentary disclosure in a human rights complaint
      — does "arguable relevance" under the tribunal's rules apply, or can procedural fairness factors require
      a heightened level of disclosure — and how far does it extend to accommodation records from unrelated
      competitions, other candidates' application materials, and managers' employment-equity-linked performance
      agreements?
