  - id: lc-fca-03
    phase: 1
    jurisdiction: federal
    area: administrative law / judicial review — mootness, declaratory relief, and the appellate standard
      of review of a discretionary refusal to hear a moot case
    source: drafted-from-decision
    drafted_from: 2023 FCA 219
    scenario: During a public-health emergency, my clients — a group of unvaccinated travellers, including
      a former elected official — were barred from boarding domestic flights and passenger trains by a series
      of temporary federal orders that were repeatedly re-issued over about eight months. They brought judicial
      review applications arguing the orders exceeded the Minister's statutory authority and breached their
      Charter rights, and they built a substantial record (expert reports, many affidavits, weeks of cross-examinations)
      before the hearing date. The government then lifted the travel measures and moved to strike the applications
      as moot; the applications judge agreed the cases were moot and declined to hear them in any event.
      My clients say a live controversy remains because they seek declarations that would support separate
      damages claims, because the measures were only suspended and could be reimposed at any time, and because
      short-lived measures that keep getting re-issued will always evade review. They also say the public
      importance of the issues and the resources already invested should have tipped the discretion the
      other way. On appeal, how much room is there to set aside a first-instance ruling that a repealed
      emergency measure case is moot and not worth hearing?
    legal_question: Where the impugned government measure has been repealed, does a request for declaratory
      relief (including declarations said to be useful in a future damages action) preserve a live controversy,
      and on what standard may an appellate court review the first-instance court's refusal to exercise
      its discretion to hear the moot application despite arguments of judicial economy, public importance,
      and evasiveness of review?
