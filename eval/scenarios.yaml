# Retrieval eval seed set (implementation-plan.md §6).
#
# ⚠️ AI-DRAFTED, NOT YET VERIFIED. Every citation below needs a human check before this
# set is frozen and used as ground truth. A wrong "gold" citation silently punishes a
# retriever that was right. Once Phase 1 lands, resolve each citation against
# cases.neutral_citation and fix or drop anything that doesn't resolve, then flip
# `verified: true` per scenario.
#
# Scenarios are weighted toward immigration, tax, admin, labour and SCC-level tort and
# contract law, because that is where the A2AJ corpus is actually deep (FC 35.9k, FCA
# 7.8k, TCC 8.1k, SCC 10.9k, RAD/RPD 21k, SST 17.9k). Ontario-only scenarios are tagged
# phase: 7 — they are not answerable until the ONCA/e-Laws work lands.
#
# relevance: primary   = a retriever that misses this has failed the scenario
#            supporting = should surface, but its absence is not a failure

scenarios:
  - id: imm-001
    phase: 1
    jurisdiction: federal
    area: immigration / refugee
    scenario: >
      My client fled persecution in her home country. The Refugee Protection Division
      accepted that her fear was genuine but refused the claim because it said she
      could have moved to another city in the same country instead of leaving. How is
      that assessed on judicial review?
    expected_authorities:
      - citation: "[1992] 1 FC 706"
        name: Rasaratnam v Canada (Minister of Employment and Immigration)
        kind: case
        relevance: primary
      - citation: "[1994] 1 FC 589"
        name: Thirunavukkarasu v Canada (Minister of Employment and Immigration)
        kind: case
        relevance: primary
    verified: false

  - id: imm-002
    phase: 1
    jurisdiction: federal
    area: immigration / humanitarian and compassionate
    scenario: >
      A family facing removal applied to stay in Canada on humanitarian and
      compassionate grounds. The officer refused and barely mentioned the two children
      who were born here. What authority governs how the children's interests must be
      treated?
    expected_authorities:
      - citation: "2015 SCC 61"
        name: Kanthasamy v Canada (Citizenship and Immigration)
        kind: case
        relevance: primary
      - citation: "[1999] 2 SCR 817"
        name: Baker v Canada (Minister of Citizenship and Immigration)
        kind: case
        relevance: primary
    verified: false

  - id: admin-001
    phase: 1
    jurisdiction: federal
    area: administrative law
    scenario: >
      A federal tribunal interpreted its own governing statute in a way my client says
      is wrong. We are applying for judicial review. What standard will the court apply
      to the tribunal's interpretation?
    expected_authorities:
      - citation: "2019 SCC 65"
        name: Canada (Minister of Citizenship and Immigration) v Vavilov
        kind: case
        relevance: primary
      - citation: "2008 SCC 9"
        name: Dunsmuir v New Brunswick
        kind: case
        relevance: supporting
        note: largely superseded by Vavilov — a good test of whether ranking prefers current law
    verified: false

  - id: admin-002
    phase: 1
    jurisdiction: federal
    area: administrative law / procedural fairness
    scenario: >
      A federal decision-maker cancelled my client's licence without letting him respond
      to the allegations and without giving reasons. What does the duty of fairness
      require here?
    expected_authorities:
      - citation: "[1999] 2 SCR 817"
        name: Baker v Canada (Minister of Citizenship and Immigration)
        kind: case
        relevance: primary
      - citation: "[1990] 1 SCR 653"
        name: Knight v Indian Head School Division No 19
        kind: case
        relevance: supporting
    verified: false

  - id: tax-001
    phase: 1
    jurisdiction: federal
    area: tax
    scenario: >
      My client ran a small side business at a loss for several years and deducted the
      losses. CRA reassessed, saying it was really a hobby and not a source of income.
      What is the test?
    expected_authorities:
      - citation: "2002 SCC 46"
        name: Stewart v Canada
        kind: case
        relevance: primary
      - citation: "RSC 1985, c 1 (5th Supp)"
        name: Income Tax Act, s 18(1)(a)
        kind: statute
        relevance: supporting
    verified: false

  - id: tax-002
    phase: 1
    jurisdiction: federal
    area: tax / anti-avoidance
    scenario: >
      A corporate group ran a series of transactions that technically complied with the
      Income Tax Act but whose only real effect was to eliminate tax. CRA invoked the
      general anti-avoidance rule. How is abuse assessed?
    expected_authorities:
      - citation: "2005 SCC 54"
        name: Canada Trustco Mortgage Co v Canada
        kind: case
        relevance: primary
      - citation: "2011 SCC 63"
        name: Copthorne Holdings Ltd v Canada
        kind: case
        relevance: primary
      - citation: "RSC 1985, c 1 (5th Supp)"
        name: Income Tax Act, s 245
        kind: statute
        relevance: supporting
    verified: false

