  - id: lc-fc-01
    phase: 1
    jurisdiction: federal
    area: administrative law / judicial review — procedural fairness and disclosure in federal passport
      revocation and refusal of passport services
    source: drafted-from-decision
    drafted_from: 2016 FC 526
    scenario: 'My client held a Canadian passport issued in the name he has used for years, and he renewed
      it without difficulty. The federal passport authority then opened an investigation after a provincial
      ID office flagged him, and it wrote to him saying it believed he had obtained the passport by giving
      false or misleading information under an assumed identity, and that he also stood charged with an
      indictable offence for breaching a release condition. The letters set out a summary of what the investigators
      said they had found and invited him to respond; he replied through a representative with a superior
      court order permitting a delayed birth registration, the resulting birth registration, and a sworn
      declaration, all in the name he uses. A second letter told him his material did not neutralize the
      findings, and the director then revoked the passport and cut him off from passport services for about
      five years. When the full record was produced for the court challenge, it turned out to contain things
      he had never seen: facial recognition comparison results that matched his photo to the passports in
      his current name but not to the earlier passports in the other name, police and provincial investigator
      emails, an incomplete internal investigation report, and references to several other criminal charges
      that were never put to him in either letter. Was the passport program required to disclose all of
      that material to him before deciding, and if it was not disclosed, can the revocation and the multi-year
      refusal of services stand?'
    legal_question: In a passport revocation and refusal-of-services decision, does the duty of procedural
      fairness require the passport authority to disclose to the affected person all material facts gathered
      in its investigation — including potentially exculpatory evidence and allegations not put in the notice
      letters — before a decision-maker rules, and what is the consequence of failing to do so?
