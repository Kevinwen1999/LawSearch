  - id: lc-fpslreb-01
    phase: 1
    jurisdiction: federal
    area: federal public sector labour relations / recovery of salary overpayment — limitation periods under
      s. 32 of the Crown Liability and Proceedings Act
    source: drafted-from-decision
    drafted_from: 2023 FPSLREB 57
    scenario: My client is an employee of a federal separate employer. She went on sick leave after a serious
      illness, and her paid sick leave credits ran out partway through, at which point she should have moved
      to leave without pay. Because of errors in the pay system, the employer kept depositing her regular
      biweekly pay for about two more months, resulting in an overpayment of roughly $7,700. Almost three
      years later, the employer emailed her out of the blue saying it would start recovering that money,
      and it began deducting a small amount from each pay cheque. She lived and worked in the same province
      where the employer is headquartered, where its compensation and pay administration are run, and where
      the person who wrote the recovery demand was based — though the employer says it is a national organization,
      the money came out of the federal consolidated revenue fund, and the debt is owed to a federal entity,
      so a six-year federal limitation period should govern. Is the employer's recovery action out of time
      because the shorter provincial limitation period applies, or does the federal six-year period apply
      simply because the debt is owed to the federal Crown?
    legal_question: Under s. 32 of the Crown Liability and Proceedings Act, does a federal employer's action
      to recover a salary overpayment from an employee constitute a cause of action "arising otherwise than
      in a province" (six-year limitation period) merely because the employer is national and the debt is
      owed to a federal entity, or must the adjudicator conduct a fact-based inquiry into where the elements
      of the cause of action arose and apply the provincial limitation period where they all arose in one
      province?
