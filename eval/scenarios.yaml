  - id: lc-rad-02
    phase: 1
    jurisdiction: federal
    area: refugee law / RAD appeal — standard of review, religious conversion credibility, sur place claim,
      minor's claim
    source: drafted-from-decision
    drafted_from: TB3-07088
    scenario: My client is a woman from Iran who went abroad to do a graduate degree, taking her young daughter
      with her while her husband stayed behind. While overseas she became interested in Christianity through
      a friend and began attending church. On returning home she was held and questioned for several days
      at the airport about travelling without her husband, was sexually assaulted in custody, and later
      began attending a house church that met in a private home. She travelled to Canada on a visitor visa
      to help a sick relative, was told by her husband that security officials had searched their house,
      seized her Bible and laptop and said house-church members had named her, and she claimed protection
      here; she was later publicly baptized at a church in Canada and her daughter was present. The first-level
      tribunal rejected both claims on credibility, finding she was not a genuine convert, giving little
      weight to the baptismal certificate and pastor's letter, relying partly on a religious-knowledge question
      about whether Jesus baptized people, and disposing of the child's claim as entirely derivative. On
      appeal we filed no new evidence and asked for an oral hearing or a rehearing, arguing the appeal body
      owes no deference, that risk from a public baptism must be assessed regardless of sincerity, and that
      the child's risk from having witnessed the conversion needed separate analysis. How much deference
      does the appeal division give to the first-level tribunal's credibility findings in these circumstances,
      and must it still assess sur place risk and the child's claim independently?
    legal_question: What standard of review does the Refugee Appeal Division apply to the RPD's credibility
      and fact findings where no new evidence is filed and no oral hearing is held, and does a negative
      credibility finding on the genuineness of a religious conversion relieve the decision-maker of assessing
      a sur place claim based on a public baptism in Canada and the separate risk to an accompanying minor?
