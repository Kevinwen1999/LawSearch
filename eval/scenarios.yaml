  - id: lc-sst-02
    phase: 1
    jurisdiction: federal
    area: employment insurance / voluntarily leaving employment without just cause — whether a "reasonable
      alternative" must be certain; workplace harassment and duty to seek a resolution with the employer
    source: drafted-from-decision
    drafted_from: 2026 SST 411
    scenario: My client worked at a care facility where co-workers mocked her weight and a persistent body
      odour, and would put on gloves or use tissue whenever they handed her anything or took something from
      her. The odour turned out to be caused by an abscess she did not know about, but before that was discovered
      management had also spoken to her twice about the smell because of complaints from clients. She raised
      the harassment with HR and with the owner and nothing was done, and she eventually went off on a medical
      leave, during which she also had ankle surgery. When the employer proposed bringing her back at a
      second site away from the co-workers who had been harassing her, she objected that the commute was
      much longer and costlier and that she could not manage full shifts while recovering; the employer
      said it would look at her requests for part-time hours and extra pay, but she resigned before anything
      was settled, believing the employer could not be trusted and that the harassment would follow her
      anywhere. Her EI claim was refused on the basis that she quit without just cause because the transfer
      was a reasonable alternative, and the first-level appeal agreed. She wants to know whether an option
      that was never confirmed — a transfer on terms the employer had not yet agreed to, at a location she
      says would have been just as toxic — can count as a "reasonable alternative" she was required to pursue
      before quitting.
    legal_question: For the purposes of just cause under the Employment Insurance Act, must a "reasonable
      alternative" to quitting be certain or already in existence, or is a claimant obliged to explore a
      merely possible option — such as continued negotiation with the employer over a transfer, hours and
      pay — even where the employer has previously failed to act on harassment complaints?
