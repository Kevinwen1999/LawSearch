# Retrieval eval seed set (implementation-plan.md §6).
#
# ⚠️ AI-DRAFTED, NOT YET VERIFIED. Every citation below needs a human check before this
# set is frozen and used as ground truth. A wrong "gold" citation silently punishes a
# retriever that was right. Case citations have now been resolved against
# cases.citation (see citations_resolved below); a human still needs to confirm
# relevance and flip `verified: true` per scenario.
#
# Scenarios are weighted toward immigration, tax, admin, labour and SCC-level tort and
# contract law, because that is where the A2AJ corpus is actually deep (FC 35.9k, FCA
# 7.8k, TCC 8.1k, SCC 10.9k, RAD/RPD 21k, SST 17.9k). Ontario-only scenarios are tagged
# phase: 7 — they are not answerable until the ONCA/e-Laws work lands.
#
# relevance: primary   = a retriever that misses this has failed the scenario
#            supporting = should surface, but its absence is not a failure
#
# citations_resolved (checked 2026-09-13 against the Phase 1 federal corpus): every
# *case* authority in the scenario exists in `cases` under that citation, with the
# expected style of cause. It proves existence, not relevance — `verified` still means
# a human confirmed these are the right authorities. Statutes are unchecked until Phase 5.
#
# Coverage gap found: A2AJ FC and FCA decisions start 2001-02-01. Pre-2001 Federal
# Court / FCA authorities (reported only in the FC reports) are not in the corpus.

scenarios:
  - id: imm-001
    phase: 1
    jurisdiction: federal
    area: immigration / refugee
    scenario: >
      My client fled persecution in her home country. The Refugee Protection Division
      accepted that her fear was genuine but refused the claim because it said she
      could have moved to another city in the same country instead of leaving. How is
      that assessed on judicial review?
    expected_authorities:
      - citation: "[1992] 1 FC 706"
        name: Rasaratnam v Canada (Minister of Employment and Immigration)
        kind: case
        relevance: primary
        in_corpus: false
      - citation: "[1994] 1 FC 589"
        name: Thirunavukkarasu v Canada (Minister of Employment and Immigration)
        kind: case
        relevance: primary
        in_corpus: false
      - citation: "2020 FC 428"
        name: Leon v Canada (Citizenship and Immigration)
        kind: case
        relevance: primary
      - citation: "2010 FC 263"
        name: Calderon v Canada (Citizenship and Immigration)
        kind: case
        relevance: supporting
      - citation: "2016 FC 1142"
        name: Okechukwu v Canada (Citizenship and Immigration)
        kind: case
        relevance: supporting
    notes: >
      Rasaratnam and Thirunavukkarasu predate the corpus (FC/FCA coverage starts 2001).
      Replacements chosen from the corpus: the post-2001 FC decisions stating the two-prong
      IFA test that are most cited by other IFA decisions (Leon 118, Calderon 95,
      Okechukwu 101 citing IFA decisions); each was checked to set out the test.
    citations_resolved: true
    verified: false
    split: tune

