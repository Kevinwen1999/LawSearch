  - id: lc-tcc-01
    phase: 1
    jurisdiction: federal
    area: tax / individual residence for child benefit eligibility
    source: drafted-from-decision
    drafted_from: 2010 TCC 658
    scenario: My client was born, raised and schooled in Canada and left in his early twenties to marry
      a foreign citizen and enrol in a specialized full-time religious training program that is only offered
      overseas; he has now been abroad continuously in that program for about sixteen years, living with
      his wife and children in an apartment his in-laws bought for them, with the children in local schools
      and local doctors. He kept a furnished apartment available to him rent-free in his parents' Canadian
      home, left his books and possessions there, kept Canadian bank and investment accounts, a registered
      education plan, provincial health coverage, his synagogue and mentor relationships, party membership
      and voting, holds only a Canadian passport, has never filed a foreign tax return, and has a standing
      offer of a teaching post in Canada once he finishes. The tax authority clawed back two years of child
      benefits, first saying his wife (who never lived in Canada) could not validly declare him the primary
      caregiver, then abandoning that at the hearing and arguing instead that he himself was not resident
      in Canada in the relevant base years — an argument never raised at the objection stage, and the Crown's
      own pleaded assumption was that he was resident. He says nothing about his circumstances changed at
      any identifiable moment after he left, and the revenue agency had earlier written to him confirming
      he remained a factual resident while studying, though his application for that letter understated
      how long he had been away. Can an unbroken absence of this length purely to complete full-time studies,
      with all Canadian ties maintained and a firm intention to return, cost him Canadian residence — and
      who has to prove it when the residence issue surfaces only at trial?
    legal_question: Does a Canadian who remains outside Canada for well over a decade solely to complete
      continuous full-time studies, while retaining a dwelling available to him, financial, social and civic
      ties, and a demonstrated intention (and job offer) to return, cease to be "resident" or "ordinarily
      resident" in Canada for purposes of the eligible-individual definition governing child benefits —
      and where the Crown raises non-residence for the first time in the appeal contrary to its own pleaded
      assumption, does the burden of proof fall on the Crown?
    expected_authorities:
