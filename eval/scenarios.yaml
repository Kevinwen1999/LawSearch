  # Multi-issue Ontario wrongful dismissal (from search_endpoint_eval_ontario_wrongful_dismissal.txt,
  # 2026-09-24). Tests per-issue coverage across eight issues in one fact pattern; `issues` on
  # each authority says which issue it answers. Gold written from memory by the eval's author;
  # corpus citations resolved 2026-09-24 and the three CanLII-only ones confirmed on CanLII.
  # Negative: Canada Labour Code ss 240-246 should not come back (provincially regulated employer).
  - id: on-003
    phase: 7
    jurisdiction: ontario
    area: employment / wrongful dismissal, multi-issue
    scenario: >
      My client, Dana Reyes, age 54, worked as an Operations Manager at Northline
      Logistics Inc. in Mississauga from March 2012 until August 14, 2026, earning
      $98,000 a year plus benefits and a 10% annual bonus. Northline has about 180
      employees and an Ontario payroll well above $3 million.
      In 2019, seven years into her job, HR told her to sign a "new standard
      contract" or she "wouldn't be eligible for the upcoming restructuring." She
      got no raise, bonus, or anything else for signing. The contract's
      termination clause says: "The Company may terminate your employment at any
      time, in its sole discretion, for any reason, by providing the minimum
      notice or pay in lieu required by the Employment Standards Act, 2000. The
      Company may terminate your employment for cause, without notice or pay in
      lieu, where cause includes any breach of Company policy." The contract says
      nothing about benefits continuing after termination.
      From February to June 2026, Dana was on medical leave after spinal surgery.
      Her doctor recommended a graduated return (four-hour days for six weeks).
      Her manager emailed her: "We really need someone who can commit to full days
      in this role." Three weeks after she came back, Northline fired her without
      cause. The termination letter offered 8 weeks' pay in lieu of notice. It
      said her benefits and any further payments would continue only if she signed
      a full and final release within 5 days.
      Dana hasn't signed. She has applied to about 30 comparable jobs and has no
      offers. She wants to know what claims she has, how much notice she may be
      entitled to, whether the termination clause is enforceable, and what
      deadlines apply.
    issues:
      I1: termination clause enforceability (for-cause wording, sole discretion, benefits silence)
      I2: no fresh consideration for the 2019 contract
      I3: reasonable notice at common law
      I4: bonus during the notice period
      I5: disability discrimination / failure to accommodate
      I6: conditional release vs ESA statutory entitlements
      I7: mitigation
      I8: limitation periods and choice of forum
    expected_authorities:
      - citation: "2020 ONCA 391"
        name: Waksdale v Swegon North America Inc
        kind: case
        relevance: primary
        issues: [I1]
      - citation: "2017 ONCA 158"
        name: Wood v Fred Deeley Imports Ltd
        kind: case
        relevance: primary
        issues: [I1]
      - citation: "[1992] 1 SCR 986"
        name: Machtinger v HOJ Industries Ltd
        kind: case
        relevance: primary
        issues: [I1, I3]
      - citation: "C39836"
        name: Hobbs v TDI Canada Ltd (2004, Ont CA)
        kind: case
        relevance: primary
        issues: [I2]
        court: ONCA
        note: pre-neutral-citation ONCA; stored under its docket number
      - citation: "2008 SCC 39"
        name: Honda Canada Inc v Keays
        kind: case
        relevance: primary
        issues: [I3, I5]
      - citation: "2020 SCC 26"
        name: Matthews v Ocean Nutrition Canada Ltd
        kind: case
        relevance: primary
        issues: [I4]
      - citation: "2008 SCC 20"
        name: Evans v Teamsters Local Union No 31
        kind: case
        relevance: primary
        issues: [I7]
      - citation: "2025 ONCA 379"
        name: Bertsch v Datastealth Inc
        kind: case
        relevance: primary
        issues: [I1]
